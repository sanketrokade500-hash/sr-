name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Kishore Driving School APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install NPM Dependencies
        run: |
          npm install

      - name: 🔨 Build React + TypeScript Web App
        run: |
          npm run build

      - name: 📱 Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: 🚀 Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          # Configure Android SDK from GitHub runner environment
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi

          # Accept all SDK licenses automatically
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi

          # Grant execution permissions
          chmod +x ./gradlew || true

          # If gradlew wrapper is missing, use gradle from runner or build directly
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 📤 Upload Kishore Driving School APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kishore-Driving-School-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
